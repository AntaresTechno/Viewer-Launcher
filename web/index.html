<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer · 阅读</title>
    <script>
      // 首帧前应用持久化的设计风格与明暗模式，避免主题闪烁。
      // 历史 localStorage 值 "md3"（Material You）按 "md3e" 处理。
      (function () {
        try {
          var d = localStorage.getItem("viewer_design");
          document.documentElement.dataset.design =
            d === "miuix" ? "miuix" : "md3e";
          var m = localStorage.getItem("viewer_theme_mode");
          if (m === "system") {
            m = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (m === "dark") {
            document.documentElement.classList.add("m-theme-dark");
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-RAH3Attl.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DWNtTHDn.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
