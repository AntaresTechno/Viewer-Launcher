name: Build launcher

on:
  workflow_dispatch:
  push:
    branches-ignore: [web, lib]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-amd64
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Linux GUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev
      - name: Build native launcher
        shell: bash
        run: |
          go mod download
          go build -trimpath -ldflags "-s -w -X main.repository=${{ github.repository }}" -o ViewerLauncher .
      - uses: actions/upload-artifact@v6
        with:
          name: ViewerLauncher-${{ matrix.target }}
          path: ViewerLauncher*
