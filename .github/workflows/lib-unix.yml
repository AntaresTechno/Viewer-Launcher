name: Build Viewer lib for Linux

on:
  workflow_run:
    workflows: ["Build Viewer lib dependency branch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Viewer main commit SHA used for requirements and backend
        required: true
        default: main

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            key: linux-amd64
            pbs_suffix: x86_64-unknown-linux-gnu
            pip_platform: manylinux_2_17_x86_64
          - runner: ubuntu-24.04
            key: linux-arm64
            pbs_suffix: aarch64-unknown-linux-gnu
            pip_platform: manylinux_2_17_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: AntaresTechno/Viewer
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || 'main' }}
          path: upstream
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build portable lib directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_REPOSITORY: ${{ github.repository }}
          PLATFORM_KEY: ${{ matrix.key }}
          PBS_SUFFIX: ${{ matrix.pbs_suffix }}
          PIP_PLATFORM: ${{ matrix.pip_platform }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            commit="$(curl --fail --retry 3 --silent --show-error "https://raw.githubusercontent.com/$LAUNCHER_REPOSITORY/lib/lib/windows-amd64/lib.json" | python -c 'import json, sys; print(json.load(sys.stdin)["upstream_commit"])')"
            git -C upstream checkout --detach "$commit"
          fi
          publish="$RUNNER_TEMP/viewer-lib-publish"
          lib="$publish/lib/$PLATFORM_KEY"
          mkdir -p "$lib/licenses/python" "$lib/LICENSES" "$RUNNER_TEMP/wheels" "$RUNNER_TEMP/pbs"
          asset="$(gh api repos/astral-sh/python-build-standalone/releases/latest --jq '.assets[].name' | grep "^cpython-3\.12.*${PBS_SUFFIX}-install_only\.tar\.gz$" | head -n 1)"
          test -n "$asset"
          gh release download --repo astral-sh/python-build-standalone --pattern "$asset" --dir "$RUNNER_TEMP/pbs"
          tar -xzf "$RUNNER_TEMP/pbs/$asset" -C "$RUNNER_TEMP/pbs"
          prefix="$(dirname "$(dirname "$(find "$RUNNER_TEMP/pbs" -type f -path '*/bin/python3' -print -quit)")")"
          test -x "$prefix/bin/python3"
          mv "$prefix" "$lib/python"
          stdlib="$(find "$lib/python/lib" -mindepth 1 -maxdepth 1 -type d -name 'python3.12' -print -quit)"
          test -n "$stdlib"
          site_packages="$stdlib/site-packages"
          mkdir -p "$site_packages"
          python -m pip download --only-binary=:all: --platform "$PIP_PLATFORM" --implementation cp --python-version 312 --abi cp312 --dest "$RUNNER_TEMP/wheels" -r upstream/backend/requirements.txt
          python tools/install_wheels.py --wheels "$RUNNER_TEMP/wheels" --target "$site_packages"
          cp upstream/LICENSE "$lib/LICENSES/Viewer-GPL-3.0-or-later.txt"
          python_license="$(find "$lib/python" -maxdepth 3 -type f -iname 'LICENSE*' -print -quit)"
          test -n "$python_license"
          cp "$python_license" "$lib/LICENSES/CPython.txt"
          python tools/license_check.py --site-packages "$site_packages" --policy licenses-policy.json --report "$lib/licenses/python-packages.json" --notices-dir "$lib/licenses/python"
          commit="$(git -C upstream rev-parse HEAD)"
          COMMIT="$commit" python -c 'import json, os; print(json.dumps({"upstream_repository":"AntaresTechno/Viewer", "upstream_commit":os.environ["COMMIT"], "python_series":"3.12", "runtime":"python-build-standalone"}))' > "$lib/lib.json"
      - name: Publish platform lib directory
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: lib
          publish_dir: ${{ runner.temp }}/viewer-lib-publish/lib/${{ matrix.key }}
          destination_dir: lib/${{ matrix.key }}
          keep_files: true
